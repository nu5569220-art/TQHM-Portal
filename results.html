<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ফলাফল | TQHM</title><style>body{font-family:system-ui;background:#f2f6f8;padding:20px;color:#18313b}.box{max-width:600px;margin:auto;background:white;padding:24px;border-radius:16px}label{display:block;margin-top:12px}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #ccd;border-radius:8px}button{background:#116878;color:white;font-weight:bold}#out{margin-top:18px;padding:12px;background:#edf5f7;border-radius:8px}</style><div class="box"><h1>পরীক্ষার ফলাফল</h1><form id="f"><label>শ্রেণি</label><select id="c"><option value="PP">প্রি-প্লে</option><option value="PL">প্লে</option><option value="NU">নার্সারী</option><option value="C1">১ম শ্রেণি</option><option value="C2">২য় শ্রেণি</option><option value="C3">৩য় শ্রেণি</option><option value="C4">৪র্থ শ্রেণি</option><option value="NO">নূরানী</option><option value="NZ">নাযেরা</option><option value="HF">হিফজ</option></select><label>রোল</label><input id="r" required><button>ফলাফল দেখুন</button></form><div id="out">প্রকাশিত ফলাফল এখানে দেখা যাবে।</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbx7M0c-APniOaQPylENPaXwa7JjWzniRUDw6UVhMyxmuwaMYcLhN2s2jIB5Iwyme1vY/exec";
function jsonp(url){return new Promise((resolve,reject)=>{const cb="cb_"+Math.random().toString(36).slice(2);const s=document.createElement("script");window[cb]=d=>{resolve(d);delete window[cb];s.remove()};s.onerror=()=>{reject(Error("API connection failed"));delete window[cb];s.remove()};s.src=url+"&callback="+cb;document.body.appendChild(s)})}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const o=document.getElementById("out");o.textContent="খোঁজা হচ্ছে…";try{const d=await jsonp(API+"?action=publicResults&classCode="+encodeURIComponent(c.value)+"&roll="+encodeURIComponent(r.value));if(!d.ok||!d.results.length){o.textContent="এই রোলের প্রকাশিত ফলাফল পাওয়া যায়নি।";return}o.innerHTML=d.results.map(x=>"<h3>"+(x.examName||"পরীক্ষার ফলাফল")+"</h3><p>নাম: "+(x.name||"")+"</p><p>রোল: "+(x.roll||"")+"</p><p>মোট নম্বর: "+(x.total??"")+"</p><p>গ্রেড: "+(x.grade||"")+"</p>").join("")}catch(e){o.textContent="সংযোগ সমস্যা। পরে আবার চেষ্টা করুন।"}};
</script></html>
